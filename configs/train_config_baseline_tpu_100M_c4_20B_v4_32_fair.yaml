# Vanilla Transformer Baseline — TPU Training Config, 100M Scale, 20B tokens
# Fair comparison with DAWN v17.1 100M at 20B tokens on v4-32
# Parameter-matched: d_model=768, n_layers=11, d_ff=3072 ≈ 101.4M params
# Global batch: 1024 = 32 chips × 32 per_device_batch

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 20000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: "baseline"
  d_model: 768
  d_ff: 3072
  n_layers: 11
  n_heads: 12
  max_seq_len: 512
  dropout: 0.1
  gradient_checkpointing: true

training:
  batch_size: 1024
  gradient_accumulation_steps: 1
  num_epochs: 1
  lr: 0.0005
  weight_decay: 0.1
  warmup_ratio: 0.06
  orthogonality_weight: 0.0
  diversity_weight: 0.0
  load_balance_weight: 0.0
  entropy_weight: 0.0
  process_norm_weight: 0.0
  checkpoint_interval: 200
  val_interval: 200

use_amp: true

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/baseline_100M_c4_20B_v4_32_fair
log_dir: gs://dawn-tpu-data-c4/logs/baseline_100M_c4_20B_v4_32_fair
