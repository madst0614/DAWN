# DAWN v17.1-TPU Training Config - 100M Scale, 20B tokens, v4-32 Pod (FAIR)
# Parameter-matched with baseline 100M (d_model=768, n_layers=11, ~101.4M)
# Pool ratio V/QK=4.69 matches 400M FAIR (QK=192, V=Know=900)
# Total params ≈ 101,295,616 (~0.1% match with baseline ~101,400,000)
# Global batch: 1024 = 32 chips × 32 per_device_batch

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 20000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: "17.1"
  d_model: 768
  n_layers: 11
  n_heads: 12
  rank: 64

  n_feature_qk: 68
  n_feature_v: 319
  top_k_feature_qk: 24
  top_k_feature_v: 24

  n_restore_qk: 68
  n_restore_v: 319
  top_k_restore_qk: 24
  top_k_restore_v: 24

  n_feature_know: 319
  n_restore_know: 319
  knowledge_rank: 64
  top_k_feature_know: 24
  top_k_restore_know: 24

  max_seq_len: 512
  dropout: 0.1
  gradient_checkpointing: true
  d_space: 256
  router_dropout: 0.1

training:
  batch_size: 1024
  gradient_accumulation_steps: 1
  num_epochs: 1
  lr: 0.0005
  weight_decay: 0.1
  warmup_ratio: 0.06
  orthogonality_weight: 0.01
  diversity_weight: 0.1
  load_balance_weight: 0.0001
  entropy_weight: 0.0
  process_norm_weight: 0.0
  checkpoint_interval: 200
  val_interval: 200

use_amp: true

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_v17_1_100M_c4_20B_v4_32_fair
log_dir: gs://dawn-tpu-data-c4/logs/dawn_v17_1_100M_c4_20B_v4_32_fair
