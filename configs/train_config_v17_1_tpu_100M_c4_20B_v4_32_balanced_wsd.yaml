# DAWN v17.1-TPU Training Config - 100M Scale, 20B tokens, v4-32 Pod (BALANCED + WSD)
# Same architecture as balanced config, with WSD LR schedule
# Parameter-matched with baseline 100M (~101.4M)
# QK:V:Know capacity ratio = 1:1.4:5
# Compute ~104% of baseline (router included)
# Know/FFN = 73%
# LR schedule: Warmup 8% → Stable 62% → Decay 30% (min_lr = 0.1 × peak)
# Global batch: 1024 = 32 chips × 32 per_device_batch

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 20000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: "17.1"
  d_model: 768
  n_layers: 11
  n_heads: 12
  rank: 64

  n_feature_qk: 96
  n_feature_v: 144
  top_k_feature_qk: 7
  top_k_feature_v: 10

  n_restore_qk: 96
  n_restore_v: 144
  top_k_restore_qk: 7
  top_k_restore_v: 10

  n_feature_know: 479
  n_restore_know: 479
  knowledge_rank: 64
  top_k_feature_know: 35
  top_k_restore_know: 35

  max_seq_len: 512
  dropout: 0.1
  gradient_checkpointing: true
  d_space: 128
  router_dropout: 0.1

training:
  batch_size: 1024
  gradient_accumulation_steps: 1
  num_epochs: 1
  lr: 0.0005
  weight_decay: 0.1
  lr_schedule: "wsd"
  warmup_ratio: 0.08
  stable_ratio: 0.62
  decay_ratio: 0.30
  min_lr_ratio: 0.1
  orthogonality_weight: 0.01
  diversity_weight: 0.1
  load_balance_weight: 0.0001
  entropy_weight: 0.0
  process_norm_weight: 0.0
  checkpoint_interval: 200
  val_interval: 200

use_amp: true

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_v17_1_100M_c4_20B_v4_32_balanced_wsd
log_dir: gs://dawn-tpu-data-c4/logs/dawn_v17_1_100M_c4_20B_v4_32_balanced_wsd
